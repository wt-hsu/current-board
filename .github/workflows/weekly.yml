name: weekly-radar

on:
  # schedule is OFF until the private data repo exists (SPEC v3 stage 3): radar.db holds article bodies and
  # must not be committed to this public repo. Run the pipeline locally for now; dispatch manually if needed.
  # schedule:
  #   - cron: "0 0 * * 1"        # every Monday 00:00 UTC = 08:00 Taipei
  workflow_dispatch:
    inputs:
      lookback:
        description: "Override lookback_days (e.g. 30 to catch up after a missed week)"
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: weekly-radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Run pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::warning::ANTHROPIC_API_KEY secret is not set — extraction will be skipped."
          fi
          radar run ${{ inputs.lookback && format('--lookback {0}', inputs.lookback) || '' }} || true

      - name: Commit results
        run: |
          git config user.name "venture-radar bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/radar.db reports docs config/watchlist.accepted.yaml
          git diff --cached --quiet && echo "nothing to commit" && exit 0
          git commit -m "radar: weekly run $(date -u +%Y-%m-%d)"
          git push

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: radar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
