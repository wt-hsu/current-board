[project]
name = "current-board"
version = "0.3.0"
description = "Current Board: a weekly radar of the power and infrastructure behind AI"
requires-python = ">=3.10"
dependencies = [
  "anthropic>=1.11",
  "pydantic>=2.0",
  "feedparser>=6.0",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "jinja2>=3.1",
  "markdown>=3.5",
  "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
radar = "radar.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["radar*"]

[tool.setuptools.package-data]
radar = ["templates/*.j2"]
