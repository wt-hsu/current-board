# ---- Importance scale 1–5. Goes verbatim into the prompt: editing this retrains the machine. ----
importance_scale:
  5:
    zh: 改變價值鏈某一層供需結構的事件：GW 級購電或園區、核電重啟或新建核電定案、州級或國家級政策首例、十億美元級併購或融資
    en: Changes the supply/demand structure of a layer — GW-scale offtake or campus, a nuclear restart or new-build decision, a first-of-its-kind state/national policy, a $1B+ acquisition or raise
  4:
    zh: 主要玩家的具體承諾：有數字的資本支出、新廠或新園區、百 MW 級長約、億美元級交易
    en: A concrete commitment by a major player — capex with a number, a new plant or campus, a 100 MW-class contract, a $100M-class deal
  3:
    zh: 有名字有金額的一般交易、產品發表、有實質內容的合作
    en: A named deal with an amount, a product launch, or a partnership with substance
  2:
    zh: 評論、分析、重述既有消息、無金額的意向宣告
    en: Commentary, analysis, re-reporting, or an intention without numbers
  1:
    zh: 邊緣相關或無法驗證
    en: Marginally relevant or unverifiable
