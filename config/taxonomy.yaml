# Controlled vocabulary. Every classification field must use a code from this file, or nothing aggregates later.
# Each code carries label_en (public board) and label_zh (the analyst's private bilingual workbench).
# importance_scale goes verbatim into Claude's prompt: revise it after reading the decision log and the machine follows.

# ---- Value-chain layer: where a signal or a company mainly sits ----
value_chain:
  compute_demand:
    label_zh: 算力需求端
    label_en: AI Compute Demand
    scope: compute and power demand from hyperscalers, AI labs and neoclouds; campus announcements; self-built power
  generation_nuclear:
    label_zh: 核能發電
    label_en: Nuclear Generation
    scope: nuclear restarts, life extensions, SMRs, new-build nuclear, nuclear fuel supply
  generation_other:
    label_zh: 其他發電
    label_en: Gas, Fuel Cell & Onsite Power
    scope: gas turbines, fuel cells, onsite generation, geothermal, renewable projects when built for data centers
  transmission_grid:
    label_zh: 輸配電與電網設備
    label_en: Transmission & Grid Equipment
    scope: transformers, switchgear, HVDC, transmission lines, interconnection queues, grid expansion
  storage:
    label_zh: 儲能
    label_en: Energy Storage
    scope: battery storage, long-duration storage, storage project finance
  dc_physical:
    label_zh: 資料中心實體層
    label_en: Data Center Power & Cooling
    scope: power distribution, UPS, cooling, liquid cooling, modular halls, electrical and mechanical supply chain
  dc_development:
    label_zh: 資料中心開發
    label_en: Data Center Development & REIT
    scope: campus development, real estate, land and power procurement, data-center REITs, campus financing
  offtake_markets:
    label_zh: 購電與市場
    label_en: PPAs, Offtake & Markets
    scope: PPAs, capacity markets, tariffs and rate cases, power trading
  energy_software:
    label_zh: 能源軟體
    label_en: Energy Software
    scope: VPPs, forecasting, dispatch optimisation, grid analytics, energy management systems
  policy_regulation:
    label_zh: 政策與監管
    label_en: Policy & Regulation
    scope: FERC, state and national energy policy, permitting reform, export controls, data-center cost-allocation rules
  other:
    label_zh: 其他
    label_en: Other
    scope: relevant but fits none of the layers above

