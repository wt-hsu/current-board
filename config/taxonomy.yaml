  capex:            { label_zh: 資本支出與建廠, label_en: Capex & Buildout }
  earnings:         { label_zh: 財報與財測,    label_en: Earnings & Guidance }
  partnership:      { label_zh: 合作與客戶,    label_en: Partnership }
  product:          { label_zh: 產品與技術,    label_en: Product & Technology }
  supply_chain:     { label_zh: 供應鏈與產能,  label_en: Supply Chain & Capacity }
  people:           { label_zh: 人事異動,      label_en: People }
