# Current Board 追蹤名單（The Panel）。直接編輯這個檔案；每次 `radar run` 會把它同步進資料庫。
# 每個對象必填：name, entity_type, value_chain。代碼必須來自 config/taxonomy.yaml。
# aliases 用於把新聞對到這個對象（不會拿去搜尋）；domain 是身分證；ticker 給上市公司。
# 這是公開示範名單；真實名單在私人資料裡，含不公開的 notes 欄位。
